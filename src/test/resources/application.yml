# Test-classpath override, merged on top of src/main/resources/application.yml.
#
# By default, NO test in this project should depend on a running Kafka
# broker just because Kafka is on the classpath — the M0-M3 tests only ever
# needed PostgreSQL/Redis, and that must stay true. This file turns off the
# two things that would otherwise reach out to Kafka on every Spring context
# used by any @SpringBootTest: the scheduled outbox publisher, and
# @KafkaListener container auto-start.
#
# The handful of M4 tests that DO want Kafka re-enable both, explicitly, via
# @TestPropertySource — see e.g. OutboxPublisherKafkaIntegrationTest — and
# are separately gated on KAFKA_BOOTSTRAP_SERVERS being set.
spring:
  kafka:
    listener:
      auto-startup: false

app:
  outbox:
    publisher-enabled: false
