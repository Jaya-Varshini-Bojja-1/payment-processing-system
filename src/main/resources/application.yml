# Host-local run. Credentials come from the environment — never commit passwords.

spring:
  application:
    name: payment-processing-system
  # We authenticate purely via our own JwtAuthenticationFilter (no in-memory
  # users, no AuthenticationManager), so suppress Spring Boot's default
  # generated-user autoconfiguration and its console password log.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:payment_system}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
  # M4: outbox -> Kafka -> idempotent consumer. Payloads travel as plain
  # JSON strings (see OutboxEvent.payloadJson) — the publisher never
  # deserializes a domain object, it just relays the text Postgres already
  # holds, so String (de)serializers are all either side needs.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: payment-processing-system
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Auth / JWT settings (M1). JWT_SECRET must be a Base64-encoded key of at least
# 256 bits, provided via environment variable — never hardcode or commit it.
# M6 hardening: the logout/revocation denylist (TokenDenylistService, keyed
# jwt:denylist:<jti> in Redis, TTL = remaining token life) fails CLOSED if
# Redis is unreachable — an unchecked-able token is treated as revoked
# (401) rather than risk letting a logged-out token through. This uses the
# same REDIS_HOST/REDIS_PORT settings under spring.data.redis above; no
# separate env var is needed for this policy.
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    issuer: payment-processing-system
  refresh-token:
    ttl: ${REFRESH_TOKEN_TTL:P7D}
  # M3: client idempotency + P2P transfer settings.
  idempotency:
    redis-ttl: ${IDEMPOTENCY_REDIS_TTL:P1D}
  transfer:
    max-optimistic-lock-attempts: ${TRANSFER_MAX_LOCK_ATTEMPTS:3}
  # M6: per-user Redis rate limiting for money-moving POSTs (transfer create,
  # deposit create, withdrawal create) — see RateLimitProperties/RateLimiterService.
  # Fails OPEN if Redis is unreachable (unlike the JWT denylist below, which
  # fails CLOSED): PostgreSQL idempotency/ledger invariants already guarantee
  # financial correctness regardless of Redis's availability, so an outage of
  # this optional abuse-prevention layer must not also take down legitimate
  # traffic.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    limit: ${RATE_LIMIT_MAX_REQUESTS:20}
    window: ${RATE_LIMIT_WINDOW:PT1M}
  # M4: transactional outbox -> Kafka. Topic names are config, not code, so
  # OutboxPublisher never needs to know an event type called "TransferCompleted"
  # exists (see TransferEventPublisher, which is the one place that does).
  outbox:
    transfer-completed-topic: ${TRANSFERS_COMPLETED_TOPIC:transfers.completed}
    transfer-dlq-topic: ${TRANSFERS_DLQ_TOPIC:transfers.dlq}
    # M5: deposit/withdrawal gateway dispatch. One processing topic for both
    # types (see PROJECT_PLAN.md section 11); the shared DLQ topic also
    # receives PUBLISH_FAILED/CONSUME_FAILED entries from the same generic
    # outbox/Kafka-consumer machinery M4 already built.
    payment-processing-topic: ${PAYMENTS_PROCESS_TOPIC:payments.process}
    payment-dlq-topic: ${PAYMENTS_DLQ_TOPIC:payments.dlq}
    publisher-enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    # Gates only the @Scheduled poll loop, independent of publisher-enabled
    # above (which gates bean existence). Kafka integration tests that call
    # publishDueEvents() directly set this false via @TestPropertySource so
    # the ambient background tick can't race their own deterministic call
    # for the same rows.
    scheduler-enabled: ${OUTBOX_SCHEDULER_ENABLED:true}
    publish-batch-size: ${OUTBOX_PUBLISH_BATCH_SIZE:20}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
    initial-backoff: ${OUTBOX_INITIAL_BACKOFF:PT1S}
    backoff-multiplier: ${OUTBOX_BACKOFF_MULTIPLIER:2.0}
    publish-timeout: ${OUTBOX_PUBLISH_TIMEOUT:PT5S}
    stale-publishing-timeout: ${OUTBOX_STALE_PUBLISHING_TIMEOUT:PT1M}
    consumer-max-attempts: ${OUTBOX_CONSUMER_MAX_ATTEMPTS:3}
    consumer-retry-backoff: ${OUTBOX_CONSUMER_RETRY_BACKOFF:PT0.5S}
  # M5: gateway-level retry policy for PaymentTransaction processing --
  # independent of the outbox's own publish-retry settings above (this
  # governs re-dispatch to the simulated gateway after a retryable
  # failure, not Kafka delivery retries).
  payment:
    max-gateway-attempts: ${PAYMENT_MAX_GATEWAY_ATTEMPTS:3}
    retry-initial-backoff: ${PAYMENT_RETRY_INITIAL_BACKOFF:PT2S}
    retry-backoff-multiplier: ${PAYMENT_RETRY_BACKOFF_MULTIPLIER:2.0}
  # M5: deterministic amount-bucketed simulated gateway (see GatewayProperties).
  # amountPaise % 100 selects the demo scenario: [0,80) succeeds; [80,90)
  # fails once then succeeds on retry; [90,95) always fails retryably
  # (exhausts into REQUIRES_MANUAL_REVIEW); [95,100) is a permanent decline.
  gateway:
    success-upper-bound: ${GATEWAY_SUCCESS_UPPER_BOUND:80}
    retry-succeeds-upper-bound: ${GATEWAY_RETRY_SUCCEEDS_UPPER_BOUND:90}
    non-retryable-upper-bound: ${GATEWAY_NON_RETRYABLE_UPPER_BOUND:95}
